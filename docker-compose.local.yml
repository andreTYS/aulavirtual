# Para desarrollo/pruebas en tu máquina local (sin Traefik ni dominio).
# Uso: docker compose -f docker-compose.local.yml up -d
# Luego abre: http://localhost:8080/login.php
services:
  web:
    image: php:8.4-apache
    container_name: aulavirtual-web-local
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./public_html:/var/www/html
    environment:
      DB_HOST: aulavirtual-db-local
      DB_NAME: aulavirtual
      DB_USER: aulavirtual
      DB_PASS: localdevpass
    depends_on:
      - db
    command: >
      bash -c "docker-php-ext-install pdo pdo_mysql
      && a2enmod rewrite
      && apache2-foreground"
  db:
    image: mariadb:10.11
    container_name: aulavirtual-db-local
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: localrootpass
      MYSQL_DATABASE: aulavirtual
      MYSQL_USER: aulavirtual
      MYSQL_PASSWORD: localdevpass
    volumes:
      - aulavirtual_db_local_data:/var/lib/mysql
      - ./db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "13306:3306"
volumes:
  aulavirtual_db_local_data:
