services:
  web:
    image: php-apache-custom
    container_name: aulavirtual-web
    restart: unless-stopped
    environment:
      # Credenciales OAuth2 de Google Cloud para la integracion con Google
      # Meet (ver README/instrucciones de despliegue). Mientras queden
      # vacias, el sistema sigue funcionando con enlace de Meet manual.
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GOOGLE_REDIRECT_URI: "https://aulavirtual.iestpbf.edu.pe/google_oauth_callback.php"
      # Servidor SMTP para notificaciones por correo (nota nueva, aviso
      # publicado, mensaje sin leer). Mientras queden vacias, el sistema
      # sigue funcionando normalmente, solo sin enviar esos correos.
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: "no-responder@iestpbf.edu.pe"
      SMTP_FROM_NAME: "Aula Virtual - IESTP Benjamín Franklin"
      SMTP_SECURE: "tls"
    volumes:
      - /opt/sites/aulavirtual.iestpbf.edu.pe/public_html:/var/www/html
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aulavirtual.rule=Host(`aulavirtual.iestpbf.edu.pe`)"
      - "traefik.http.routers.aulavirtual.entrypoints=websecure"
      - "traefik.http.routers.aulavirtual.tls=true"
      - "traefik.http.routers.aulavirtual.tls.certresolver=mytlschallenge"
      - "traefik.http.services.aulavirtual.loadbalancer.server.port=80"
    networks:
      - traefik
    depends_on:
      - db
  db:
    image: mariadb:10.11
    container_name: aulavirtual-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 8aPPwLpuYT3cgZrNBtFKDiNx
      MYSQL_DATABASE: aulavirtual
      MYSQL_USER: aulavirtual
      MYSQL_PASSWORD: qjWiBhv8vNi28334sNdG94Ei
    volumes:
      - aulavirtual_db_data:/var/lib/mysql
      - ./db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - traefik
networks:
  traefik:
    external: true
    name: n8n_default
volumes:
  aulavirtual_db_data:
