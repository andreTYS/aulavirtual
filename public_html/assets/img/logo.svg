<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <path id="topArc"    d="M 12,100 A 88,88 0 1,1 188,100"/>
    <path id="bottomArc" d="M 33,124 A 72,72 0 0,0 167,124"/>
    <clipPath id="ovalMask">
      <ellipse cx="100" cy="101" rx="42" ry="56"/>
    </clipPath>
    <radialGradient id="ovalGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#FAD93A"/>
      <stop offset="100%" stop-color="#C8900A"/>
    </radialGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#2E6B1E"/>
      <stop offset="100%" stop-color="#1A4210"/>
    </radialGradient>
  </defs>

  <!-- ── OUTER BROWN RING ── -->
  <circle cx="100" cy="100" r="99" fill="#6B3A0A"/>
  <!-- gold band -->
  <circle cx="100" cy="100" r="95" fill="#C8900A"/>
  <!-- thin separator -->
  <circle cx="100" cy="100" r="89" fill="#7B4510"/>
  <circle cx="100" cy="100" r="87" fill="#C8900A"/>

  <!-- ── ARC TEXT ── -->
  <text font-family="'Arial Narrow',Arial,sans-serif" font-size="7.4" font-weight="bold"
        fill="#2A1000" letter-spacing="0.2">
    <textPath href="#topArc" startOffset="4.5%">INSTITUTO DE EDUCACIÓN SUPERIOR TECNOLÓGICO PRIVADO</textPath>
  </text>
  <text font-family="'Arial Narrow',Arial,sans-serif" font-size="8.8" font-weight="bold"
        fill="#2A1000" letter-spacing="0.6">
    <textPath href="#bottomArc" startOffset="14%">BENJAMÍN FRANKLIN</textPath>
  </text>

  <!-- ── GREEN BACKGROUND CIRCLE ── -->
  <circle cx="100" cy="100" r="78" fill="url(#bgGrad)"/>

  <!-- ── GOLD OVAL ── -->
  <ellipse cx="100" cy="101" rx="44" ry="58" fill="#A07008"/>
  <ellipse cx="100" cy="101" rx="42" ry="56" fill="url(#ovalGrad)"/>

  <!-- ── LEFT HALF: COLORED FLAG STRIPES ── -->
  <g clip-path="url(#ovalMask)">
    <rect x="58"  y="45"  width="42" height="15" fill="#1C3A8C"/>
    <rect x="58"  y="60"  width="42" height="14" fill="#CC1A00"/>
    <rect x="58"  y="74"  width="42" height="14" fill="#1A7A1A"/>
    <rect x="58"  y="88"  width="42" height="14" fill="#111111"/>
    <!-- fade boundary: right side blend back to oval gold -->
    <rect x="90"  y="45"  width="10" height="57"
          fill="url(#ovalGrad)" opacity="0.75"/>
  </g>

  <!-- ── RIGHT HALF: COMPUTER EQUIPMENT ── -->
  <!-- monitor -->
  <rect x="110" y="62" width="22" height="17" rx="1.5" fill="#2A2A2A"/>
  <rect x="111" y="63" width="20" height="15" rx="1"   fill="#4A90D9"/>
  <!-- monitor stand -->
  <rect x="119" y="79" width="4"  height="4"  fill="#2A2A2A"/>
  <rect x="115" y="83" width="12" height="2"  fill="#2A2A2A"/>
  <!-- tower/PC case -->
  <rect x="109" y="84" width="8"  height="14" rx="1" fill="#3A3A3A"/>
  <rect x="110" y="86" width="6"  height="2"  rx="0.5" fill="#5A5A5A"/>
  <rect x="110" y="90" width="6"  height="1"  fill="#5A5A5A"/>
  <!-- keyboard -->
  <rect x="110" y="100" width="22" height="5" rx="1" fill="#3A3A3A"/>
  <rect x="111" y="101" width="20" height="3" rx="0.5" fill="#555"/>

  <!-- ── SATELLITE DISH ── -->
  <!-- dish bowl -->
  <path d="M 109,117 Q 117,108 126,112 Q 130,118 122,124 Z"
        fill="#1A5A9A" stroke="#0A3A6A" stroke-width="0.5"/>
  <!-- dish arm -->
  <line x1="117" y1="113" x2="119" y2="109" stroke="#0A3A6A" stroke-width="1.2"/>
  <circle cx="119" cy="108" r="1.5" fill="#3A7AC0"/>
  <!-- dish pole -->
  <line x1="120" y1="124" x2="120" y2="132" stroke="#0A3A6A" stroke-width="1.5"/>
  <rect x="116" y="131" width="8" height="2" rx="0.5" fill="#0A3A6A"/>

  <!-- ── BF CALLIGRAPHIC MONOGRAM ── -->
  <text x="87"  y="107"
        font-family="Georgia,'Times New Roman',serif" font-style="italic"
        font-weight="bold" font-size="28" fill="#1A0A00" opacity="0.82"
        letter-spacing="-2">B</text>
  <text x="92"  y="128"
        font-family="Georgia,'Times New Roman',serif" font-style="italic"
        font-weight="bold" font-size="22" fill="#1A0A00" opacity="0.82">F</text>

  <!-- ── "IESTP" TOP OF OVAL ── -->
  <text x="100" y="54"
        text-anchor="middle"
        font-family="'Arial Black',Arial,sans-serif"
        font-weight="900" font-size="9.5" fill="#1A0A00" letter-spacing="1.5">IESTP</text>

  <!-- ── "MOQUEGUA" BOTTOM OF OVAL ── -->
  <text x="100" y="150"
        text-anchor="middle"
        font-family="'Arial Black',Arial,sans-serif"
        font-weight="900" font-size="8.5" fill="#1A0A00" letter-spacing="1">MOQUEGUA</text>

  <!-- ── OVAL BORDER ── -->
  <ellipse cx="100" cy="101" rx="42" ry="56" fill="none"
           stroke="#8B5E00" stroke-width="1.5"/>
</svg>
